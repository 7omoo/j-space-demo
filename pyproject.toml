[project]
name = "jspace-demo"
version = "1.0.0"
description = "J-Space Demo: what an LLM says, and what it has in mind, read with the Jacobian lens (J-lens)"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Oginome Tomohito" }]
requires-python = ">=3.13,<3.14"
keywords = ["J-Space", "J-lens", "Jacobian lens", "interpretability", "sycophancy", "LLM"]
dependencies = [
    "jlens",
    "torch>=2.14",
    "transformers>=5.18",
    "huggingface-hub",
    "numpy",
    "fastapi",
    "uvicorn",
]

[project.urls]
Repository = "https://github.com/7omoo/j-space-demo"

[project.scripts]
jspace-demo = "jspace_demo.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pytest-playwright",
    "httpx2>=2.13.1",
]

[tool.uv.sources]
# Upstream reference implementation, cloned at a pinned commit by scripts/bootstrap.sh. Never edited.
jlens = { path = "vendor/jacobian-lens", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jspace_demo"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long Japanese strings count double width

[tool.ruff.lint.isort]
# jspace_demo must be imported before torch / jlens / transformers: importing it enables the MPS CPU fallback,
# which PyTorch reads once at import time. A dedicated first section keeps isort from reordering that away.
section-order = ["future", "jspace-demo", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.isort.sections]
"jspace-demo" = ["jspace_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # tests/payload_shape.py, shared by the heavy tests
# Heavy tests are opt-in (docs/testing.md): `-m model` loads a real model, `-m api` needs a running server
# with a model, `-m e2e` drives a browser against the static site.
markers = [
    "model: loads a real model (heavy; run alone, one LLM at a time)",
    "api: talks to a running local app at JSPACE_URL",
    "e2e: drives Chromium (Playwright) against the static site",
]
addopts = "-m 'not model and not api and not e2e'"
