name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install (upstream jacobian-lens at the pinned commit, then uv sync)
        run: scripts/bootstrap.sh
      - name: The Qwen3.5-4B tokenizer (no weights), for the tests that find the user's message in the chat template
        run: uv run python -c "from transformers import AutoTokenizer; AutoTokenizer.from_pretrained('Qwen/Qwen3.5-4B')"
      - name: Formatting, lint, the page's JavaScript, unit tests
        run: scripts/check.sh
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Every screen in both languages, desktop and phone
        run: uv run pytest -m e2e

  deploy:
    name: Publish the static site
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
