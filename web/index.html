    <meta name="color-scheme" content="light dark" />
    <script>
      // The theme before the first paint: the reader's choice, else the system's (web/core/theme.js switches it).
      (() => {
        let stored = null;
        try {
          stored = localStorage.getItem("jspace.theme");
        } catch {
          // storage blocked: follow the system
        }
        const dark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          stored === "dark" || stored === "light" ? stored : dark ? "dark" : "light";
      })();
    </script>
